name: Trigger auto deployment for overseer-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/overseer-api-AutoDeployTrigger-da43faf9-31f2-40ec-b687-1b5a78218cff.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OVERSEERAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OVERSEERAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OVERSEERAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: overseerrgacr.azurecr.io
          registryUsername: ${{ secrets.OVERSEERAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.OVERSEERAPI_REGISTRY_PASSWORD }}
          containerAppName: overseer-api
          resourceGroup: overseer-rg
          imageToBuild: overseerrgacr.azurecr.io/overseer-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


